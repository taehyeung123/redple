<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>레드플</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header class="head">
    <span class="logo">R</span>
    <div class="head-text">
      <b>레드플</b>
      <small>레드랭크 블로그 어시스턴트</small>
    </div>
  </header>

  <section id="account" class="card">
    <div id="account-loading" class="loading">연결 확인 중…</div>

    <div id="account-in" class="hidden">
      <div class="user-row">
        <div class="user-info">
          <b id="user-name">-</b>
          <span id="user-plan" class="plan-badge">-</span>
        </div>
      </div>
      <div class="coin-row">
        <span class="coin-label">보유 코인</span>
        <b id="user-coins">0</b>
      </div>
      <div id="plan-notice" class="notice hidden"></div>
    </div>

    <div id="account-out" class="hidden">
      <p class="out-msg">레드랭크 계정을 연결하면 AI 원고 생성·법적 검사를 바로 쓸 수 있습니다.</p>
      <input id="key-input" type="password" placeholder="API 키 (rr_...)" autocomplete="off">
      <button id="key-save" class="btn btn-primary">연결하기</button>
      <a class="link" href="https://www.redrank.kr/profile" target="_blank" rel="noopener">
        레드랭크에서 API 키 발급받기 →
      </a>
    </div>
  </section>

  <section class="card">
    <h2 class="card-title">빠른 키워드 조회</h2>
    <div class="kw-row">
      <input id="kw-input" type="text" placeholder="키워드 입력" maxlength="100">
      <button id="kw-go" class="btn btn-sm">조회</button>
    </div>
    <div id="kw-result"></div>
  </section>

  <nav class="actions">
    <button id="open-panel" class="action">
      <b>AI 원고 생성</b>
      <small>사이드패널에서 바로 작성</small>
    </button>
    <a class="action" href="https://www.redrank.kr/dashboard" target="_blank" rel="noopener">
      <b>레드랭크 열기</b>
      <small>전체 기능 대시보드</small>
    </a>
  </nav>

  <footer class="foot">
    <button id="open-options" class="foot-link">설정</button>
    <span class="foot-ver" id="ver"></span>
  </footer>

  <script type="module" src="popup.js"></script>
</body>
</html>
